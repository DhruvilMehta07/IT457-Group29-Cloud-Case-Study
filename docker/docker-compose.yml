# Stage A and Stage B: the app and its own Postgres database, both in containers.
# Run from the repo root:  docker compose -f docker/docker-compose.yml up --build
#
# For Stage C (database moved to Amazon RDS) use docker-compose.rds.yml instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-telemetry_dev_pw}
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://telemetry:${DB_PASSWORD:-telemetry_dev_pw}@db:5432/telemetry
      STAGE: ${STAGE:-A-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:5000"
    restart: unless-stopped

volumes:
  pgdata:
